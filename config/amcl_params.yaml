amcl:
  ros__parameters:
    odom_model_type: "diff-corrected"
    alpha1: 0.1 #0.5
    alpha2: 0.1 #0.5
    alpha3: 0.1 #0.5
    alpha4: 0.1 #0.5
    alpha5: 0.1 #0.5 #0.05
    base_frame_id: "ego_racecar/base_link"
    beam_skip_distance: 0.1 #0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 4.0 #6.0
    laser_max_range: 15.0
    laser_min_range: 0.3
    laser_model_type: "likelihood_field"
    laser_max_beams: 100 #30 #could be more???
    max_beams: 1000 #600 #60
    max_particles: 2000 #5000 #2000
    min_particles: 200 #200
    odom_frame_id: "ego_racecar/odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1 #1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.15
    tf_broadcast: true
    transform_tolerance: 0.05 #0.05 #0.1 #0.05 #1.0
    update_min_a: 0.1 #0.1 #0.2
    update_min_d: 0.05 #0.05 #0.1 #0.25
    z_hit: 0.9 #0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    set_initial_pose: true
    initial_pose:
        x: 0.0
        y: 0.0
        z: 0.0
        yaw: 0.0